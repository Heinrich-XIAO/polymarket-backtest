[project]
name = "polymarket-backtest"
version = "1.0.0"
description = "Backtest trading strategies on Polymarket prediction markets"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.19,<1",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
